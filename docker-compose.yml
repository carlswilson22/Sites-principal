# ==============================================================================
# docker-compose.yml — Orquestração de containers para ambiente de desenvolvimento.
#
# Objetivo e Motivo da Criação:
#   - Sobe simultaneamente os serviços de frontend, backend FastAPI e banco de dados PostgreSQL
#     com hot-reloading e rede interna configurada para a Auto-Dealership.
# ==============================================================================
name: auto-dealership

services:
  # Database Service (PostgreSQL 15)
  db:
    image: postgres:15-alpine
    container_name: auto-dealership-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autodealership}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # Restrito ao localhost (porta 5433 externa para evitar conflito com PostgreSQL local)
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-autodealership}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - auto-dealership-network

  # Backend Service (FastAPI / Python 3.11 - Perfil de Desenvolvimento)
  backend:
    image: auto-dealership-backend:latest
    build:
      context: "./backend"
      dockerfile: Dockerfile
    container_name: auto-dealership-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-autodealership}}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-auto_dealership_dev_jwt_secret_key_change_me_in_prod}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - PORT=8000
    command: [ "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]
    ports:
      # Restrito ao localhost para documentacao Swagger direta
      - "127.0.0.1:8000:8000"
    volumes:
      - "./backend:/app"
      - "./backend/uploads:/app/uploads"
      - "./frontend/public/images:/app/public_images:ro"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - auto-dealership-network

  # Frontend Service (React 18 / Vite SPA - Perfil de Desenvolvimento)
  frontend:
    image: auto-dealership-frontend:latest
    build:
      context: "./frontend"
      dockerfile: Dockerfile
    container_name: auto-dealership-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - "./frontend:/app"
      - "/app/node_modules"
    environment:
      - VITE_API_URL=/api
      - VITE_BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - auto-dealership-network

  # Central API Gateway (Nginx Reverse Proxy)
  gateway:
    image: auto-dealership-gateway:latest
    build:
      context: "./gateway"
      dockerfile: Dockerfile
    container_name: auto-dealership-gateway
    restart: unless-stopped
    ports:
      # Ponto unico de entrada HTTP para navegadores
      - "80:80"
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - auto-dealership-network

networks:
  auto-dealership-network:
    driver: bridge

volumes:
  postgres_data:
