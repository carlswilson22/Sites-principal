# ==============================================================================
# .github/workflows/ci.yml – Pipeline de Integração Contínua do monorepo Sites-principal
#
# NOTA: Este CI é específico para o monorepo de sites tiered (Portal Hub + 3 modelos).
#       Ele verifica o build do monorepo sem fazer deploy.
# ==============================================================================
name: CI - Monorepo Sites Check

on:
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  build-check:
    name: Build Check (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --include=optional

      - name: Install Rollup Linux binary
        run: npm install -D @rollup/rollup-linux-x64-gnu || true

      - name: Build all sites
        run: node scripts/build-all.mjs

      - name: Verify dist output
        run: |
          echo "=== Verificando saída do build ==="
          find dist -maxdepth 2 -type f -name "index.html"
          echo "✅ Build CI concluído com sucesso"
