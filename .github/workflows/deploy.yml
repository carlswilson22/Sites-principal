name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

# Permissões necessárias para o GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Apenas um deploy simultâneo; não cancela deploys em andamento
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build Monorepo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (root workspace)
        run: npm install --include=optional

      - name: Install Rollup Linux binary (CI compatibility)
        run: npm install -D @rollup/rollup-linux-x64-gnu || true

      - name: Build all sites
        run: node scripts/build-all.mjs

      - name: Verify dist structure
        run: |
          echo "=== Estrutura do dist ==="
          find dist -maxdepth 2 -type f -name "index.html"
          echo "========================="

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
